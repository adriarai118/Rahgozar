name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Test
        run: |
          go mod tidy
          go test ./internal/parser/ ./internal/smart/ ./internal/engine/
      - name: Build Rahgozar.exe
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER="0.0.0-dev"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -tags desktop,production \
            -ldflags "-H windowsgui -s -w -X rahgozar/internal/core.Version=$VER" -o pkg/Rahgozar.exe .
      - name: Bundle Iran rule-sets
        run: |
          mkdir -p pkg/rules
          for f in geoip-ir geosite-ir geosite-category-ads-all geosite-malware geosite-phishing; do
            curl -fsSL -o pkg/rules/$f.srs "https://github.com/Chocolate4U/Iran-sing-box-rules/releases/latest/download/$f.srs"
          done
          date +%Y%m%d%H%M > pkg/rules/version.txt
      - name: Zip
        run: cd pkg && zip -r ../Rahgozar-windows-amd64.zip .
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: Rahgozar-windows-amd64.zip
