name: release

on:
  push:
    branches: [main]
    paths: ["VERSION"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Test
        run: |
          go mod tidy
          go test ./internal/parser/ ./internal/smart/ ./internal/engine/
          CGO_ENABLED=0 go test ./internal/desk/
      - name: Build Rahgozar.exe
        run: |
          VER="$(cat VERSION | tr -d '[:space:]')"
          echo "VER=$VER" >> "$GITHUB_ENV"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -tags desktop,production \
            -ldflags "-H windowsgui -s -w -X rahgozar/internal/core.Version=$VER" -o pkg/Rahgozar.exe .
      - name: Bundle Iran rule-sets
        run: |
          mkdir -p pkg/rules
          for f in geoip-ir geosite-ir geosite-category-ads-all geosite-malware geosite-phishing; do
            curl -fsSL -o pkg/rules/$f.srs "https://raw.githubusercontent.com/Chocolate4U/Iran-sing-box-rules/rule-set/$f.srs"
          done
          date +%Y%m%d%H%M > pkg/rules/version.txt
      - name: Browser extension
        run: |
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VER\"/" extension/manifest.json
          cp -r extension pkg/extension
          (cd extension && zip -r ../Rahgozar-extension.zip .)
      - name: Zip
        run: cd pkg && zip -r ../Rahgozar-windows-amd64.zip .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Rahgozar ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          files: |
            Rahgozar-windows-amd64.zip
            Rahgozar-extension.zip
